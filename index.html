<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планировщик подарков</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Список идей подарков</h1>
        
        <!-- Блок бюджета -->
        <div class="budget-section">
            <label>Общий бюджет (руб.): 
                <input type="number" id="budgetInput" value="10000" oninput="updateBudget()">
            </label>
            <div class="budget-info">
                <p>Потрачено: <span id="spentAmount">0</span> руб.</p>
                <p>Остаток: <span id="balanceAmount">10000</span> руб.</p>
            </div>
        </div>

        <div class="input-section">
            <input type="text" id="giftInput" placeholder="Введите идею подарка...">
            <button onclick="addGift()">Добавить</button>
        </div>
        <ul id="giftList"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
